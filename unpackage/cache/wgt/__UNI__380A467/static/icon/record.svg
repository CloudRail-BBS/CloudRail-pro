<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 时钟外圈 -->
  <circle cx="32" cy="32" r="28" fill="#f8f8f8" stroke="#333" stroke-width="2.5"/>
  <!-- 时钟刻度 -->
  <g stroke="#333" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="8" x2="32" y2="12"/>
    <line x1="32" y1="52" x2="32" y2="56"/>
    <line x1="8" y1="32" x2="12" y2="32"/>
    <line x1="52" y1="32" x2="56" y2="32"/>
  </g>
  <!-- 时针 -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- 分针 -->
  <line x1="32" y1="32" x2="42" y2="32" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 中心点 -->
  <circle cx="32" cy="32" r="3" fill="#333"/>
  <!-- 右上角录音点 -->
  <circle cx="48" cy="16" r="6" fill="#ff4d4f"/>
  <circle cx="48" cy="16" r="3" fill="#fff"/>
</svg>