<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频播放器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; }
    #videoPlayer { width: 100%; height: 100%; background: #000; }
    .error-message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; text-align: center; background: rgba(0,0,0,0.8);
      padding: 20px; border-radius: 10px;
    }
    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在加载视频...</div>
  <video id="videoPlayer" controls autoplay playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const video = document.getElementById('videoPlayer');
      const loading = document.getElementById('loading');

      const urlParams = new URLSearchParams(window.location.search);
      const videoUrl = urlParams.get('url');

      if (!videoUrl) {
        loading.innerHTML = '<div class="error-message"><p>错误：未提供视频地址</p></div>';
        return;
      }

      console.log('原始视频URL:', videoUrl);

      // 后端代理地址
      const proxyBase = 'https://your-domain.com/API/video_stream.php?url=';

      // 创建代理URL
      function getProxyUrl(originalUrl) {
        if (!originalUrl.startsWith('http')) {
          const base = videoUrl.substring(0, videoUrl.lastIndexOf('/') + 1);
          return proxyBase + encodeURIComponent(base + originalUrl);
        }
        return proxyBase + encodeURIComponent(originalUrl);
      }

      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          manifestLoadingMaxRetry: 3,
          levelLoadingMaxRetry: 3,
          fragLoadingMaxRetry: 3,
        });

        // 重写加载器，使用代理
        const originalLoadSource = hls.loadSource.bind(hls);
        hls.loadSource = function(url) {
          const proxyUrl = getProxyUrl(url);
          console.log('使用代理:', proxyUrl);
          originalLoadSource(proxyUrl);
        };

        // 拦截所有请求
        hls.on(Hls.Events.MANIFEST_LOADING, function(event, data) {
          console.log('MANIFEST_LOADING:', data.url);
          data.url = getProxyUrl(data.url);
        });

        hls.on(Hls.Events.LEVEL_LOADING, function(event, data) {
          console.log('LEVEL_LOADING:', data.url);
          data.url = getProxyUrl(data.url);
        });

        hls.on(Hls.Events.FRAG_LOADING, function(event, data) {
          console.log('FRAG_LOADING:', data.url);
          data.url = getProxyUrl(data.url);
        });

        hls.on(Hls.Events.KEY_LOADING, function(event, data) {
          console.log('KEY_LOADING:', data.url);
          if (data.url) {
            data.url = getProxyUrl(data.url);
          }
        });

        hls.loadSource(videoUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
          console.log('MANIFEST_PARSED成功');
          loading.style.display = 'none';
          video.style.display = 'block';
        });

        hls.on(Hls.Events.LEVEL_LOADED, function(event, data) {
          console.log('LEVEL_LOADED:', data.details);
          video.play().catch(e => console.log('自动播放失败:', e));
        });

        hls.on(Hls.Events.FRAG_LOADED, function(event, data) {
          console.log('FRAG_LOADED完成');
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
          console.error('HLS错误:', data);
          if (data.fatal) {
            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                loading.innerHTML = '<div class="error-message"><p>网络错误</p></div>';
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                loading.innerHTML = '<div class="error-message"><p>媒体解码错误</p></div>';
                break;
              default:
                loading.innerHTML = '<div class="error-message"><p>加载失败</p></div>';
                hls.destroy();
                break;
            }
          } else {
            console.log('非致命错误:', data);
          }
        });

        video.addEventListener('canplay', function() {
          console.log('视频可播放');
        });

        video.addEventListener('error', function(e) {
          console.error('video元素错误:', e);
          loading.innerHTML = '<div class="error-message"><p>视频播放失败</p></div>';
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        loading.style.display = 'none';
        video.src = getProxyUrl(videoUrl);
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      } else {
        loading.innerHTML = '<div class="error-message"><p>浏览器不支持HLS</p></div>';
      }
    });
  </script>
</body>
</html>
