<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#FF8E53"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD93D"/>
      <stop offset="100%" style="stop-color:#FF9500"/>
    </linearGradient>
  </defs>
  
  <!-- 好运转盘背景 -->
  <circle cx="32" cy="32" r="28" fill="url(#wheelGrad)" stroke="#fff" stroke-width="2"/>
  
  <!-- 转盘分割线 -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#fff" stroke-width="1.5"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#fff" stroke-width="1.5"/>
  <line x1="12" y1="12" x2="52" y2="52" stroke="#fff" stroke-width="1.5"/>
  <line x1="52" y1="12" x2="12" y2="52" stroke="#fff" stroke-width="1.5"/>
  
  <!-- 中心按钮 -->
  <circle cx="32" cy="32" r="10" fill="url(#centerGrad)" stroke="#fff" stroke-width="2"/>
  
  <!-- 中心文字 -->
  <text x="32" y="37" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">好礼</text>
  
  <!-- 装饰星星 -->
  <polygon points="20,12 22,18 28,18 23,22 25,28 20,24 15,28 17,22 12,18 18,18" fill="#FFD93D"/>
  <polygon points="44,12 46,18 52,18 47,22 49,28 44,24 39,28 41,22 36,18 42,18" fill="#FFD93D"/>
  <polygon points="12,44 14,50 20,50 15,54 17,60 12,56 7,60 9,54 4,50 10,50" fill="#FFD93D"/>
  <polygon points="52,44 54,50 60,50 55,54 57,60 52,56 47,60 49,54 44,50 50,50" fill="#FFD93D"/>
</svg>
